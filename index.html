  <style>
    /* ========================================
       1. BASIC
    ======================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #62505e;
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 16px;

      background-color: #e9e3e8;
      background-image: radial-gradient(
        #d7cbd5 1px,
        transparent 1px
      );
      background-size: 12px 12px;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* ========================================
       2. MINIHOME FRAME
    ======================================== */

    .wrapper {
      width: min(1000px, 94%);
      margin: 35px auto;
      padding: 12px;

      background: #fff;
      border: 1px solid #cbb9c9;
      box-shadow: 0 5px 20px #8e778522;
    }

    /* ========================================
       3. HEADER
    ======================================== */

    .top {
      padding: 25px;
      text-align: center;

      background: #f7e9f2;
      border: 1px solid #e5c9dc;
    }

    .top h1 {
      margin: 5px;
      color: #a66c96;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .top p {
      margin: 7px;
      color: #9c7893;
    }

    .counter {
      color: #a987a1;
      font-size: 14px;
    }

    /* ========================================
       4. MAIN LAYOUT
    ======================================== */

    .main {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 15px;
      margin-top: 15px;
    }

    .sidebar,
    .content {
      padding: 15px;
      background: #fffdfd;
      border: 1px solid #e5d7e2;
    }

    .content {
      min-width: 0;
      min-height: 560px;
    }

    /* ========================================
       5. LEFT PROFILE
    ======================================== */

    .profile {
      padding-bottom: 15px;
      border-bottom: 1px dashed #dce5ec;
    }

    .profile-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 12px;
      color: #6c8494;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* Profile Image */

    .profile-photo {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;

      background: #edf2f5;
      border: 1px solid #d4e0e8;
      border-radius: 7px;
    }

    .profile-photo img {
      position: absolute;
      inset: 0;
      z-index: 1;

      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-photo-placeholder {
      color: #9eb3c1;
      font-size: 42px;
    }

    /* Name & Job */

    .profile-info {
      margin-top: 15px;
    }

    .profile-info h3 {
      margin: 0;
      color: #405c70;
      font-size: 19px;
    }

    .profile-english-name {
      margin: 3px 0 8px;
      color: #8b9fac;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .profile-job {
      margin: 0;
      color: #54738a;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    /* Introduction */

    .profile-intro {
      margin: 16px 0;
      padding: 14px 0;

      color: #536c7d;
      font-size: 14px;
      line-height: 1.9;

      border-top: 1px dashed #dce5ec;
      border-bottom: 1px dashed #dce5ec;
    }

    /* Contact Links */

    .profile-links {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #617d8f;
      font-size: 14px;
      text-decoration: none;
    }

    .profile-link span {
      width: 18px;
      color: #8299a9;
      font-size: 17px;
      text-align: center;
    }

    .profile-link:hover {
      color: #a66c96;
      text-decoration: underline;
    }

    /* More About Me Button */

    .profile-more {
      width: 100%;
      margin-top: 18px;
      padding: 11px 5px;

      background: #e9f0f4;
      color: #52758c;
      border: 1px solid #d8e4ec;
      border-radius: 6px;

      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .profile-more:hover {
      background: #d7e6ef;
    }

    /* ========================================
       6. NAVIGATION MENU
    ======================================== */

    .menu-title {
      margin: 17px 0 8px;
      color: #b27ca5;
      font-size: 14px;
      font-weight: 400;
    }

    .menu button {
      display: block;
      width: 100%;
      margin-bottom: 5px;
      padding: 10px;

      background: #fff;
      color: #80677b;
      border: 1px solid #eee3eb;

      text-align: left;
      cursor: pointer;
    }

    .menu button:hover,
    .menu button.active {
      background: #f7e8f2;
      color: #a45f90;
      border-color: #e6c6dd;
    }

    /* ========================================
       7. COMMON PAGE COMPONENTS
    ======================================== */

    .page-title {
      margin-bottom: 18px;
      padding-bottom: 12px;

      color: #a66c96;
      font-size: 20px;
      border-bottom: 1px dashed #ddc9d9;
    }

    .welcome {
      margin-bottom: 18px;
      padding: 25px;

      background: #fbf2f8;
      border: 1px solid #f0dce9;
      text-align: center;
    }

    .welcome h2 {
      color: #aa7098;
    }

    .notice {
      margin: 12px 0;
      padding: 15px;

      background: white;
      border: 1px solid #eee0eb;
    }

    .notice-title {
      color: #a66c96;
      font-weight: 400;
    }

    .small {
      color: #a38d9e;
      font-size: 14px;
    }

    /* ========================================
       8. MINI ROOM
    ======================================== */

    .room {
      display: flex;
      align-items: end;
      justify-content: center;

      min-height: 330px;
      border: 5px solid #e8d8e7;

      background: linear-gradient(
        #d8c6e1 0 48%,
        #b995a9 48% 51%,
        #e6c7d3 51%
      );
    }

    .furniture {
      margin: 0 12px 25px;
      font-size: 45px;
      text-align: center;
      cursor: pointer;
    }

    .furniture span {
      display: block;
      font-size: 14px;
    }

    /* ========================================
       9. MINI GAME
    ======================================== */

    .game-area {
      padding: 30px 15px;
      background: #faf0f7;
      border: 1px solid #ebd5e5;
      text-align: center;
    }

    .game-button {
      padding: 12px 25px;
      background: #d99fc4;
      color: white;
      border: 0;
      cursor: pointer;
    }

    /* ========================================
       10. DIARY & GUESTBOOK
    ======================================== */

    .diary {
      padding: 15px;
      border-bottom: 1px dashed #e3d3e0;
    }

    .guest-input {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: 1px solid #e5d5e2;
    }

    /* ========================================
       11. FOOTER
    ======================================== */

    .footer {
      padding: 20px;
      color: #b99bb1;
      font-size: 14px;
      text-align: center;
    }

    /* ========================================
       12. RESPONSIVE
    ======================================== */

    @media (max-width: 650px) {
      .main {
        grid-template-columns: 1fr;
      }

      .top h1 {
        font-size: 24px;
      }
    }
    /* 프로필 전체 그룹: 추가 여백 없음 */
    .profile-text-group {
      padding-left: 0;
  }

  /* 이름, 영문 이름, 직업: 오른쪽 5px */
    .profile-text-group .profile-info {

    .profile-text-group .profile-intro > .profile-intro-text {

      margin-left: 5px;
  }

  /* 이메일과 Behance: 오른쪽 2px */
    .profile-text-group .profile-links {
      padding-left: 1px;
  }
  </style>

        function renderHomeWorks() {
        const container = document.getElementById('home-work-grid');
        const projects = window.PORTFOLIO_PROJECTS;

        if (!container || !Array.isArray(projects)) {
            return;
        }

        container.replaceChildren();

        projects.slice(0, 2).forEach((project) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'home-work-card';

            const thumbnail = document.createElement('img');
            thumbnail.src = project.thumbnail;
            thumbnail.alt = project.title;
            thumbnail.loading = 'lazy';

            const title = document.createElement('strong');
            title.textContent = project.title;

            const category = document.createElement('span');
            category.textContent = project.category || '';

            button.append(thumbnail, title, category);

            button.addEventListener('click', () => {
                window.goMinihome('home', project.id);
            });

            container.appendChild(button);
        });
        }

        /* HOME이 표시될 때 썸네일 생성 */
        const homeObserver = new MutationObserver(() => {
        const container = document.getElementById('home-work-grid');

        if (container && container.children.length === 0) {
            renderHomeWorks();
        }
        });

        homeObserver.observe(document.getElementById('content'), {
        childList: true
        });

    function playHeartGame() {
      const result = document.getElementById('game-result');

      result.textContent = Math.random() > 0.5
        ? '하트를 찾았습니다! ♥'
        : '다시 도전해 보세요 ♡';
    }

<script>
/* Diary cover controls — standalone; does not alter routing or game state. */
(() => {
  function initDiaryCover() {
    const wrapper = document.querySelector('.wrapper');
    if (!wrapper || document.getElementById('diary-cover-screen')) return;
    const close = document.createElement('button');
    close.type='button'; close.className='diary-close-btn';
    close.textContent='♡';
    close.title='잠금장치를 닫아 다이어리 덮기';
    close.setAttribute('aria-label','열린 잠금장치를 눌러 다이어리 닫기');
    wrapper.appendChild(close);

    const charm = document.createElement('button');
    charm.type='button';
    charm.setAttribute('aria-label','딸기 키링 흔들기');
    charm.className='diary-keyring';
    charm.addEventListener('click', () => {
      charm.classList.remove('is-swinging');
      void charm.offsetWidth;
      charm.classList.add('is-swinging');
    });
    charm.addEventListener('animationend', () => charm.classList.remove('is-swinging'));
    charm.innerHTML='<span class="chain"></span><span class="charm">🍓</span>';
    wrapper.appendChild(charm);

    const screen = document.createElement('div');
    screen.className='diary-cover-screen';
    screen.id='diary-cover-screen';
    screen.innerHTML=`<div class="diary-cover-book">
      <div class="diary-cover-leaf">
        <div class="diary-cover-photo" aria-hidden="true"></div><button type="button" class="diary-cover-photo-edit" aria-label="표지 사진 변경" title="표지 사진 변경"></button><div class="diary-cover-label"><strong>MY MINIHOME ♡</strong><span>STRAWBERRY & CHOCO DIARY</span></div>
      </div>
      <button type="button" class="diary-cover-strap" aria-label="다이어리 잠금장치 풀고 열기" title="똑딱이를 눌러 열기">♡</button>
      <p class="diary-cover-hint">똑딱이 잠금장치를 눌러 다이어리를 열어보세요 ♡</p>
    </div>`;
    document.body.appendChild(screen);
    const coverCharm = charm.cloneNode(true);
    coverCharm.addEventListener('click', () => {
      coverCharm.classList.remove('is-swinging');
      void coverCharm.offsetWidth;
      coverCharm.classList.add('is-swinging');
    });
    coverCharm.addEventListener('animationend', () => coverCharm.classList.remove('is-swinging'));
    screen.querySelector('.diary-cover-book').insertBefore(coverCharm, screen.querySelector('.diary-cover-leaf'));
    const setFigmaScale = () => {
      // Keep the established diary size and Figma center on wide screens.
      // Below the fit threshold, use the real artwork edges (including the
      // keyring and clasp) and align the visible LEFT edge with a small gutter.
      const normalScale = 0.88;
      const artworkLeft = 56;
      const artworkRight = 1781;
      const artworkWidth = artworkRight - artworkLeft;
      const gutter = 6;
      const viewportWidth = window.innerWidth;
      const scale = Math.max(.18, Math.min(normalScale, (viewportWidth - gutter * 2) / artworkWidth));
      const isShrinking = scale < normalScale;
      // CSS positions the 1920px canvas about its center (960px).
      // Offset ONLY during shrink: leftmost artwork pixel lands at the gutter.
      const horizontalOffset = isShrinking
        ? gutter - viewportWidth / 2 + (960 - artworkLeft) * scale
        : 0;
      document.documentElement.style.setProperty('--figma-scale', String(scale));
      document.documentElement.style.setProperty('--figma-shrink-offset', `${horizontalOffset}px`);
    };
        setFigmaScale();
    window.addEventListener('resize', setFigmaScale);
    const updateCoverSize = () => {
      const bounds = wrapper.getBoundingClientRect();
      screen.style.setProperty('--closed-diary-width', `${Math.round(bounds.width / 2)}px`);
      screen.style.setProperty('--closed-diary-height', `${Math.round(bounds.height)}px`);
      // Anchor the clasp beneath the index, rather than to the variable page midpoint.
      const menu = wrapper.querySelector('.menu');
      const menuBounds = menu?.getBoundingClientRect();
      const indexBottom = menuBounds ? menuBounds.bottom - bounds.top : 310;
      const openTop = Math.max(110, Math.min(indexBottom + 22, bounds.height - 65));
      const coverBook = screen.querySelector('.diary-cover-book');
      const coverTop = Math.round((coverBook.offsetHeight - 55) / 2);
      wrapper.style.setProperty('--diary-clasp-open-top', `${Math.round(openTop)}px`);
      screen.style.setProperty('--diary-clasp-cover-top', `${Math.round(coverTop)}px`);
    };
    updateCoverSize();
    window.addEventListener('resize', updateCoverSize);
    const opener = screen.querySelector('.diary-cover-strap');
    let transitionTimer = null;
    let busy = false;
    const duration = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 620;
    const finishTransition = (opened) => {
      busy = false;
      screen.classList.remove('is-opening', 'is-closing');
      screen.classList.toggle('is-open', opened);
      screen.setAttribute('aria-hidden', opened ? 'true' : 'false');
      if (opened) close.focus({preventScroll:true});
      else opener.focus({preventScroll:true});
    };
    const openDiary = () => {
      if (busy || screen.classList.contains('is-open')) return;
      busy = true;
      clearTimeout(transitionTimer);
      updateCoverSize();
      screen.classList.remove('is-closing');
      screen.classList.add('is-opening');
      transitionTimer = setTimeout(() => finishTransition(true), duration());
    };
    const closeDiary = () => {
      if (busy || !screen.classList.contains('is-open')) return;
      busy = true;
      clearTimeout(transitionTimer);
      updateCoverSize();
      screen.classList.remove('is-open', 'is-opening');
      screen.classList.add('is-closing');
      transitionTimer = setTimeout(() => finishTransition(false), duration());
    };
    opener.addEventListener('click',openDiary);
    close.addEventListener('click',closeDiary);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initDiaryCover);
  else initDiaryCover();
})();
</script>
